{% set name = "tobac" %}
{% set version = "1.6.4" %}
{% set python_min = "3.9" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/tobac-project/{{ name }}/archive/v{{ version }}.tar.gz
  sha256: d52c65848202be76e85d9b36a1a701b65b880061fbaa8a8a41a5dd89d6ce1687


build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - numpy
    - scipy
    - scikit-image
    - scikit-learn
    - pandas
    - matplotlib-base
    - iris
    - xarray
    - cartopy
    - trackpy
    - typing_extensions

test:
  imports:
    - tobac
    - tobac.testing
  source_files:
    - tobac/tests/**/*.py
  requires:
    - python {{ python_min }}
    - pytest
  commands:
    - pytest tobac/tests
about:
  home: https://github.com/tobac-project/tobac
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Tracking and Object-Based Analysis of Clouds

  description: tobac is a flexible frameork for cloud tracking of different types of datasets
  doc_url: http://tobac.readthedocs.io/
  dev_url: https://github.com/tobac-project/tobac

extra:
  recipe-maintainers:
    - JuliaKukulies
    - freemansw1
    - mheikenfeld
    - w-k-jones
